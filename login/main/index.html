<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme: log in</title>
<style>body{font-family:system-ui;max-width:360px;margin:80px auto;padding:0 16px}label{display:block;margin:12px 0 4px}input{width:100%;padding:8px;font-size:16px}button{margin-top:16px;padding:10px 16px;font-size:16px}#error{color:#b00020;min-height:1.4em}</style>
</head><body>
<main id="login">
  <h1>Welcome back</h1>
  <form id="form">
    <label for="email">Email</label><input id="email" type="email" autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
    <p id="error" role="alert"></p>
    <button type="submit">Log in</button>
  </form>
</main>
<main id="dashboard" hidden><h1>Dashboard</h1><p>Signed in as <span id="who"></span>.</p></main>
<script src="app.js"></script>
</body></html>
