<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Shop</title>
  <style>
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #f6f7f9; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: #ffffff; border-bottom: 1px solid #e3e6ea; }
.brand { font-weight: 700; font-size: 20px; }
.cart-count { font-size: 14px; color: #57606a; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; padding: 24px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 16px; }
h2 { font-size: 18px; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.card { background: #ffffff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.thumb { font-size: 40px; text-align: center; padding: 8px 0; }
.card h3 { font-size: 16px; margin: 0; }
.price { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.was { color: #8c959f; font-weight: 400; font-size: 14px; }
.savings { background: #e6f4ea; color: #1a7f37; font-weight: 600; font-size: 14px; padding: 8px 10px; border-radius: 8px; margin: 0 0 6px; }
.tag { background: #ffe8e6; color: #b42318; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid #1f2328; background: #1f2328; color: #ffffff; padding: 8px 12px; }
button:focus-visible, input:focus-visible { outline: 2px solid #0969da; outline-offset: 2px; }
button.secondary { background: #ffffff; color: #1f2328; border-color: #d0d7de; }
button.link { background: none; border: none; color: #0969da; padding: 0; text-decoration: underline; }
.cart { background: #ffffff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 16px; align-self: start; }
.empty { color: #57606a; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 10px 0; border-bottom: 1px solid #eef0f2; }
.line-name { font-weight: 600; }
.line-total { text-align: right; }
.qty { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.qty button { padding: 2px 8px; }
.coupon { display: flex; gap: 8px; margin: 14px 0 6px; }
.coupon input { flex: 1; min-width: 0; font: inherit; padding: 8px; border: 1px solid #d0d7de; border-radius: 8px; background: #ffffff; color: #1f2328; }
.coupon-msg { font-size: 14px; min-height: 20px; margin: 0; }
.coupon-msg.ok { color: #1a7f37; }
.coupon-msg.error { color: #b42318; }
.totals { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-variant-numeric: tabular-nums; }
.totals td { padding: 4px 0; }
.totals td:last-child { text-align: right; }
.totals tr.total td { font-weight: 700; border-top: 1px solid #e3e6ea; padding-top: 8px; }
.checkout { width: 100%; padding: 10px; }
.confirmation { display: flex; flex-direction: column; gap: 12px; }
.confirmation strong { font-size: 16px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; padding: 16px; } }
</style>
</head>
<body>
  <header class="topbar">
    <span class="brand">Tiny Shop</span>
    <span class="cart-count" id="cart-count" aria-live="polite">Cart (0)</span>
  </header>

  <main class="layout">
    <section aria-labelledby="products-heading">
      <h1 id="products-heading">Products</h1>
      <div class="grid" id="products"></div>
    </section>

    <aside class="cart" aria-labelledby="cart-heading">
      <h2 id="cart-heading">Your cart</h2>
      <p class="savings" id="savings" data-testid="savings-banner" hidden></p>
      <div id="cart-body"></div>
    </aside>
  </main>

  <script>
window.CATALOG = [
  { id: 'mug', name: 'Ceramic Mug', price: 20, emoji: '☕' },
  { id: 'tote', name: 'Canvas Tote', price: 40, compareAtPrice: 60, emoji: '👜' },
  { id: 'lamp', name: 'Desk Lamp', price: 30, emoji: '💡' },
  { id: 'notebook', name: 'Notebook Set', price: 10, emoji: '📓' },
  { id: 'scarf', name: 'Wool Scarf', price: 50, compareAtPrice: 80, emoji: '🧣' },
  { id: 'candle', name: 'Soy Candle', price: 15, emoji: '🕯️' },
];
</script>
  <script>
window.Pricing = (() => {
  const SHIPPING_FEE = 5;
  const FREE_SHIPPING_MIN = 50;
  const COUPONS = { SAVE10: 0.1 };

  const round2 = (n) => Math.round(n * 100) / 100;

  function quote(items, catalog, coupon = '') {
    const lines = [];
    for (const { id, qty } of items) {
      const product = catalog.find((p) => p.id === id);
      const n = Math.max(0, Math.floor(Number(qty) || 0));
      if (!product || n === 0) continue;
      lines.push({ id, name: product.name, price: product.price, qty: n, lineTotal: round2(product.price * n), product });
    }

    const subtotal = round2(lines.reduce((sum, l) => sum + l.lineTotal, 0));

    let discount = 0;
    let couponStatus = null;
    const code = typeof coupon === 'string' ? coupon.trim().toUpperCase() : '';
    if (code) {
      const rate = Object.prototype.hasOwnProperty.call(COUPONS, code) ? COUPONS[code] : 0;
      if (!rate) {
        couponStatus = 'invalid';
      } else {
        couponStatus = 'applied';
        for (const line of lines) {
          if (line.product.onSale) continue;
          discount += line.lineTotal * rate;
        }
      }
    }
    discount = round2(discount);

    const afterDiscount = round2(subtotal - discount);
    const shipping = lines.length === 0 || afterDiscount >= FREE_SHIPPING_MIN ? 0 : SHIPPING_FEE;
    const total = round2(afterDiscount + shipping);

    return {
      lines: lines.map(({ product, ...l }) => l),
      subtotal,
      coupon: couponStatus === 'applied' ? code : null,
      couponStatus,
      discount,
      shipping,
      total,
    };
  }

  return { quote, COUPONS, SHIPPING_FEE, FREE_SHIPPING_MIN };
})();
</script>
  <script>
// Tiny Shop storefront. Prices come from pricing.js, products from products.js.

const storage = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ }
  },
};

const state = {
  cart: storage.get('cart', []),
  coupon: storage.get('coupon', ''),
  couponError: '',
  order: null,
};

function save() {
  storage.set('cart', state.cart);
  storage.set('coupon', state.coupon);
}

function currentQuote() {
  return Pricing.quote(state.cart, CATALOG, state.coupon);
}

// ----- helpers -----

const $ = (id) => document.getElementById(id);
const money = (n) => `$${Number(n).toFixed(2)}`;

// ----- product list -----

const isOnSale = (p) => Number(p.compareAtPrice) > p.price;

function renderProducts() {
  $('products').innerHTML = CATALOG.map((p) => `
    <article class="card" data-testid="product-${p.id}">
      <div class="thumb" aria-hidden="true">${p.emoji}</div>
      <h3>${p.name}</h3>
      <div class="price">
        <span>${money(p.price)}</span>
        ${isOnSale(p) ? `<s class="was">${money(p.compareAtPrice)}</s><span class="tag">Sale</span>` : ''}
      </div>
      <button type="button" data-add="${p.id}">Add to cart</button>
    </article>`).join('');
}

function renderSavings() {
  const saved = state.cart.reduce((sum, { id, qty }) => {
    const p = CATALOG.find((x) => x.id === id);
    return p && isOnSale(p) ? sum + (p.compareAtPrice - p.price) * qty : sum;
  }, 0);
  const banner = $('savings');
  banner.hidden = saved <= 0 || Boolean(state.order);
  banner.textContent = `You're saving ${money(saved)} with sale prices`;
}

function render() {
  renderCart();
  renderSavings();
}

// ----- cart -----

function addToCart(id) {
  state.order = null;
  const line = state.cart.find((l) => l.id === id);
  if (line) line.qty += 1;
  else state.cart.push({ id, qty: 1 });
  save();
  render();
}

function setQty(id, qty) {
  state.cart = qty <= 0
    ? state.cart.filter((l) => l.id !== id)
    : state.cart.map((l) => (l.id === id ? { ...l, qty } : l));
  save();
  render();
}

function renderCart() {
  const count = state.cart.reduce((n, l) => n + l.qty, 0);
  $('cart-count').textContent = `Cart (${count})`;

  if (state.order) {
    $('cart-body').innerHTML = `
      <div class="confirmation" data-testid="confirmation">
        <strong>Order ${state.order.id} is confirmed.</strong>
        <span>Total charged: <span data-testid="charged">${money(state.order.total)}</span></span>
        <button type="button" class="secondary" id="continue-shopping">Continue shopping</button>
      </div>`;
    return;
  }

  const q = currentQuote();
  if (q.lines.length === 0) {
    $('cart-body').innerHTML = '<p class="empty">Your cart is empty.</p>';
    return;
  }

  $('cart-body').innerHTML = `
    ${q.lines.map((l) => `
      <div class="line" data-testid="line-${l.id}">
        <span class="line-name">${l.name}</span>
        <span class="line-total">${money(l.lineTotal)}</span>
        <span class="qty">
          <button type="button" class="secondary" data-qty="${l.id}" data-delta="-1" aria-label="Decrease ${l.name}">−</button>
          <span>Qty ${l.qty}</span>
          <button type="button" class="secondary" data-qty="${l.id}" data-delta="1" aria-label="Increase ${l.name}">+</button>
        </span>
        <button type="button" class="link" data-remove="${l.id}">Remove</button>
      </div>`).join('')}

    <form class="coupon" id="coupon-form">
      <label class="sr-only" for="coupon-input">Coupon code</label>
      <input id="coupon-input" name="coupon" placeholder="Coupon code" autocomplete="off" value="${state.couponError ? state.couponError.typed : (q.coupon || '')}">
      <button type="submit" class="secondary">Apply</button>
    </form>
    <p class="coupon-msg ${state.couponError ? 'error' : 'ok'}" data-testid="coupon-msg">${
      state.couponError
        ? `Invalid code${q.coupon ? ` (${q.coupon} is still applied)` : ''}`
        : q.coupon ? `${q.coupon} applied. <button type="button" class="link" id="remove-coupon">Remove</button>` : ''
    }</p>

    <table class="totals">
      <tr><td>Subtotal</td><td data-testid="subtotal">${money(q.subtotal)}</td></tr>
      ${q.coupon ? `<tr><td>Coupon (${q.coupon})</td><td data-testid="discount">−${money(q.discount)}</td></tr>` : ''}
      <tr><td>Shipping</td><td data-testid="shipping">${q.shipping === 0 ? 'Free' : money(q.shipping)}</td></tr>
      <tr class="total"><td>Total</td><td data-testid="total">${money(q.total)}</td></tr>
    </table>

    <button type="button" class="checkout" id="checkout">Checkout</button>`;
}

function applyCoupon(typed) {
  const code = String(typed || '').trim();
  if (!code) return;
  const check = Pricing.quote(state.cart, CATALOG, code);
  if (check.couponStatus === 'invalid') {
    state.couponError = { typed: code };
  } else {
    state.coupon = check.coupon;
    state.couponError = '';
    save();
  }
  render();
}

function removeCoupon() {
  state.coupon = '';
  state.couponError = '';
  save();
  render();
}

function checkout() {
  const q = currentQuote();
  if (q.lines.length === 0) return;
  const n = storage.get('orderCount', 0) + 1;
  storage.set('orderCount', n);
  state.order = { id: `TS-${1000 + n}`, total: q.total };
  state.cart = [];
  state.coupon = '';
  state.couponError = '';
  save();
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.add) addToCart(t.dataset.add);
  else if (t.dataset.qty) {
    const line = state.cart.find((l) => l.id === t.dataset.qty);
    setQty(t.dataset.qty, (line ? line.qty : 0) + Number(t.dataset.delta));
  } else if (t.dataset.remove) setQty(t.dataset.remove, 0);
  else if (t.id === 'checkout') checkout();
  else if (t.id === 'remove-coupon') removeCoupon();
  else if (t.id === 'continue-shopping') { state.order = null; render(); }
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'coupon-form') return;
  e.preventDefault();
  applyCoupon(new FormData(e.target).get('coupon'));
});

renderProducts();
render();
</script>
</body>
</html>
