<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <style>
/* Layout: a paper-grey studio table; product cards on the left, a receipt on the right. */
:root {
  --paper: #ebe9e4;
  --paper-hi: #f5f4f0;
  --card: #f8f7f4;
  --ink: #1d1c1a;
  --ink-soft: #3b3a36;
  --muted: #8b877e;
  --line: #d9d6ce;
  --sale: #d4462a;
  --sale-bg: #fbe6df;
  --ok: #2f7a4b;
  --ok-bg: #e0ece2;
  --focus: #2e5bd1;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 1px 2px rgba(40, 36, 28, 0.06), 0 12px 28px -18px rgba(40, 36, 28, 0.35);
}

* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  color: var(--ink);
  background: radial-gradient(120% 70% at 50% 0%, var(--paper-hi) 0%, var(--paper) 62%) fixed, var(--paper);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.topbar {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  max-width: 1160px; margin: 0 auto;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) 8px max(20px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(145deg, #2b2a27, #555149); box-shadow: 0 6px 12px -6px rgba(0, 0, 0, 0.5); position: relative; }
.logo::after { content: ""; position: absolute; inset: 6px 6px auto auto; width: 6px; height: 6px; border-radius: 50%; background: var(--sale); }
.brand-name { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.brand-note { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.cart-count {
  font-family: var(--font-mono); font-size: 13px; font-weight: 500;
  padding: 7px 12px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow); white-space: nowrap;
}

.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; align-items: start;
  max-width: 1160px; margin: 0 auto;
  padding: 18px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px));
}
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font-size: clamp(26px, 3.4vw, 36px); line-height: 1.1; letter-spacing: -0.03em; font-weight: 600; margin: 0 0 22px; text-wrap: balance; }
h2 { font-size: 17px; letter-spacing: -0.01em; font-weight: 600; margin: 0 0 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.card {
  background: var(--card); border-radius: 18px; padding: 14px 14px 16px;
  display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow);
  transition: transform 160ms ease, box-shadow 160ms ease;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 2px 4px rgba(40, 36, 28, 0.06), 0 20px 34px -20px rgba(40, 36, 28, 0.45); }
.art {
  aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; margin-bottom: 6px;
  background: radial-gradient(90% 80% at 50% 30%, #ffffff 0%, #eeece7 70%, #e6e3dd 100%);
  display: grid; place-items: center; overflow: hidden;
}
.art svg { width: 82%; height: auto; display: block; }
.card h3 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; min-height: 22px; }
.tag {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--sale); background: var(--sale-bg); padding: 2px 7px; border-radius: 6px; align-self: center;
}

button {
  font: inherit; font-weight: 500; cursor: pointer; border-radius: 10px; border: 1px solid var(--ink);
  background: var(--ink); color: #ffffff; padding: 9px 14px;
  transition: background 120ms ease, transform 120ms ease;
}
button:hover { background: var(--ink-soft); }
button:active { transform: translateY(1px); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.card button { margin-top: 6px; }
button.secondary { background: var(--card); color: var(--ink); border-color: var(--line); }
button.secondary:hover { background: #ffffff; }
button.link { background: none; border: none; color: var(--ink); padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

.cart {
  background: var(--card); border-radius: 18px; padding: 20px 20px 18px; box-shadow: var(--shadow);
  position: sticky; top: 16px; overflow: hidden;
}
.cart::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px;
  background: radial-gradient(circle at 6px 8px, var(--paper) 5px, transparent 5.5px) 0 0 / 12px 8px repeat-x;
}
.empty { color: var(--muted); margin: 0 0 10px; }
.line { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.line-name { font-weight: 600; }
.line-total { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.qty { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
.qty button { padding: 1px 9px; border-radius: 8px; line-height: 1.4; }
.line .link { justify-self: end; color: var(--muted); }
.coupon { display: flex; gap: 8px; margin: 16px 0 6px; }
.coupon input {
  flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.04em;
  padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: #ffffff; color: var(--ink);
}
.coupon input::placeholder { letter-spacing: 0; color: var(--muted); }
.coupon-msg { font-size: 13px; min-height: 20px; margin: 0; }
.coupon-msg.ok { color: var(--ok); }
.coupon-msg.error { color: var(--sale); }
.totals { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.totals td { padding: 5px 0; }
.totals td:last-child { text-align: right; }
.totals tr.total td { font-weight: 600; font-size: 16px; border-top: 1px dashed var(--line); padding-top: 10px; }
.checkout { width: 100%; padding: 12px; border-radius: 12px; font-weight: 600; }
.confirmation { display: flex; flex-direction: column; gap: 10px; padding: 6px 0 14px; font-family: var(--font-mono); font-size: 14px; }
.confirmation strong { font-family: var(--font-ui); font-size: 17px; letter-spacing: -0.01em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.foot {
  max-width: 1160px; margin: 0 auto; color: var(--muted); font-family: var(--font-mono); font-size: 12px;
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) 36px max(20px, env(safe-area-inset-left, 0px));
}

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .cart { position: static; }
  .brand-note { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card, button { transition: none; }
}
.was { color: var(--muted); font-weight: 400; font-size: 13px; text-decoration-thickness: 1px; }
.savings {
  display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 9px 12px; border-radius: 10px;
  background: var(--ok-bg); color: var(--ok); font-size: 13px; font-weight: 600;
}
.savings::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
</style>
</head>

  <script>
window.Pricing = (() => {
  const SHIPPING_FEE = 5;
  const FREE_SHIPPING_MIN = 50;
  const COUPONS = { SAVE10: 0.1 };

  const round2 = (n) => Math.round(n * 100) / 100;

  function quote(items, catalog, coupon = '') {
    const lines = [];
    for (const { id, qty } of items) {
      const product = catalog.find((p) => p.id === id);
      const n = Math.max(0, Math.floor(Number(qty) || 0));
      if (!product || n === 0) continue;
      lines.push({ id, name: product.name, price: product.price, qty: n, lineTotal: round2(product.price * n), product });
    }

    const subtotal = round2(lines.reduce((sum, l) => sum + l.lineTotal, 0));

    let discount = 0;
    let couponStatus = null;
    const code = typeof coupon === 'string' ? coupon.trim().toUpperCase() : '';
    if (code) {
      const rate = Object.prototype.hasOwnProperty.call(COUPONS, code) ? COUPONS[code] : 0;
      if (!rate) {
        couponStatus = 'invalid';
      } else {
        couponStatus = 'applied';
        for (const line of lines) {
          if (line.product.onSale) continue;
          discount += line.lineTotal * rate;
        }
      }
    }
    discount = round2(discount);

    const afterDiscount = round2(subtotal - discount);
    const shipping = lines.length === 0 || afterDiscount >= FREE_SHIPPING_MIN ? 0 : SHIPPING_FEE;
    const total = round2(afterDiscount + shipping);

    return {
      lines: lines.map(({ product, ...l }) => l),
      subtotal,
      coupon: couponStatus === 'applied' ? code : null,
      couponStatus,
      discount,
      shipping,
      total,
    };
  }

  return { quote, COUPONS, SHIPPING_FEE, FREE_SHIPPING_MIN };
})();
</script>
  <script>
// Tiny Shop storefront. Prices come from pricing.js, products from products.js.

const storage = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ }
  },
};

const state = {
  cart: storage.get('cart', []),
  coupon: storage.get('coupon', ''),
  couponError: '',
  order: null,
};

function save() {
  storage.set('cart', state.cart);
  storage.set('coupon', state.coupon);
}

function currentQuote() {
  return Pricing.quote(state.cart, CATALOG, state.coupon);
}

// ----- helpers -----

const $ = (id) => document.getElementById(id);
const money = (n) => `$${Number(n).toFixed(2)}`;

// ----- product list -----

const isOnSale = (p) => Number(p.compareAtPrice) > p.price;

function renderProducts() {
  $('products').innerHTML = CATALOG.map((p) => `
    <article class="card" data-testid="product-${p.id}">
      <div class="art">${ART[p.id] || ''}</div>
      <h3>${p.name}</h3>
      <div class="price">
        <span>${money(p.price)}</span>
        ${isOnSale(p) ? `<s class="was">${money(p.compareAtPrice)}</s><span class="tag">Sale</span>` : ''}
      </div>
      <button type="button" data-add="${p.id}">Add to cart</button>
    </article>`).join('');
}

function renderSavings() {
  const saved = state.cart.reduce((sum, { id, qty }) => {
    const p = CATALOG.find((x) => x.id === id);
    return p && isOnSale(p) ? sum + (p.compareAtPrice - p.price) * qty : sum;
  }, 0);
  const banner = $('savings');
  banner.hidden = saved <= 0 || Boolean(state.order);
  banner.textContent = `You're saving ${money(saved)} with sale prices`;
}

function render() {
  renderCart();
  renderSavings();
}

// ----- cart -----

function addToCart(id) {
  state.order = null;
  const line = state.cart.find((l) => l.id === id);
  if (line) line.qty += 1;
  else state.cart.push({ id, qty: 1 });
  save();
  render();
}

function setQty(id, qty) {
  state.cart = qty <= 0
    ? state.cart.filter((l) => l.id !== id)
    : state.cart.map((l) => (l.id === id ? { ...l, qty } : l));
  save();
  render();
}

function renderCart() {
  const count = state.cart.reduce((n, l) => n + l.qty, 0);
  $('cart-count').textContent = `Cart (${count})`;

  if (state.order) {
    $('cart-body').innerHTML = `
      <div class="confirmation" data-testid="confirmation">
        <strong>Order ${state.order.id} is confirmed.</strong>
        <span>Total charged: <span data-testid="charged">${money(state.order.total)}</span></span>
        <button type="button" class="secondary" id="continue-shopping">Continue shopping</button>
      </div>`;
    return;
  }

  const q = currentQuote();
  if (q.lines.length === 0) {
    $('cart-body').innerHTML = '<p class="empty">Your cart is empty.</p>';
    return;
  }

  $('cart-body').innerHTML = `
    ${q.lines.map((l) => `
      <div class="line" data-testid="line-${l.id}">
        <span class="line-name">${l.name}</span>
        <span class="line-total">${money(l.lineTotal)}</span>
        <span class="qty">
          <button type="button" class="secondary" data-qty="${l.id}" data-delta="-1" aria-label="Decrease ${l.name}">−</button>
          <span>Qty ${l.qty}</span>
          <button type="button" class="secondary" data-qty="${l.id}" data-delta="1" aria-label="Increase ${l.name}">+</button>
        </span>
        <button type="button" class="link" data-remove="${l.id}">Remove</button>
      </div>`).join('')}

    <form class="coupon" id="coupon-form">
      <label class="sr-only" for="coupon-input">Coupon code</label>
      <input id="coupon-input" name="coupon" placeholder="Coupon code" autocomplete="off" value="${escapeAttr(state.couponError ? state.couponError.typed : (q.coupon || ''))}">
      <button type="submit" class="secondary">Apply</button>
    </form>
    <p class="coupon-msg ${state.couponError ? 'error' : 'ok'}" data-testid="coupon-msg">${
      state.couponError
        ? `Invalid code${q.coupon ? ` (${q.coupon} is still applied)` : ''}`
        : q.coupon ? `${q.coupon} applied. <button type="button" class="link" id="remove-coupon">Remove</button>` : ''
    }</p>

    <table class="totals">
      <tr><td>Subtotal</td><td data-testid="subtotal">${money(q.subtotal)}</td></tr>
      ${q.coupon ? `<tr><td>Coupon (${q.coupon})</td><td data-testid="discount">−${money(q.discount)}</td></tr>` : ''}
      <tr><td>Shipping</td><td data-testid="shipping">${q.shipping === 0 ? 'Free' : money(q.shipping)}</td></tr>
      <tr class="total"><td>Total</td><td data-testid="total">${money(q.total)}</td></tr>
    </table>

    <button type="button" class="checkout" id="checkout">Checkout</button>`;
}

function escapeAttr(value) {
  return String(value).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function applyCoupon(typed) {
  const code = String(typed || '').trim();
  if (!code) return;
  const check = Pricing.quote(state.cart, CATALOG, code);
  if (check.couponStatus === 'invalid') {
    state.couponError = { typed: code };
  } else {
    state.coupon = check.coupon;
    state.couponError = '';
    save();
  }
  render();
}

function removeCoupon() {
  state.coupon = '';
  state.couponError = '';
  save();
  render();
}

function checkout() {
  const q = currentQuote();
  if (q.lines.length === 0) return;
  const n = storage.get('orderCount', 0) + 1;
  storage.set('orderCount', n);
  state.order = { id: `TS-${1000 + n}`, total: q.total };
  state.cart = [];
  state.coupon = '';
  state.couponError = '';
  save();
  render();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.add) addToCart(t.dataset.add);
  else if (t.dataset.qty) {
    const line = state.cart.find((l) => l.id === t.dataset.qty);
    setQty(t.dataset.qty, (line ? line.qty : 0) + Number(t.dataset.delta));
  } else if (t.dataset.remove) setQty(t.dataset.remove, 0);
  else if (t.id === 'checkout') checkout();
  else if (t.id === 'remove-coupon') removeCoupon();
  else if (t.id === 'continue-shopping') { state.order = null; render(); }
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'coupon-form') return;
  e.preventDefault();
  applyCoupon(new FormData(e.target).get('coupon'));
});

renderProducts();
render();
</script>
</body>
</html>
